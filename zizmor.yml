rules:
  unpinned-uses:
    config:
      policies:
        kachick/*: any
        actions/*: any
        crate-ci/*: any
        dependabot/*: any
        dprint/*: any
  excessive-permissions:
    ignore:
      - merge-bot-pr.yml
      - container.yml
  template-injection:
    ignore:
      - container.yml
  secrets-outside-env:
    disable: true
