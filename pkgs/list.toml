# Package metadata for CI builds and automated updates.
#
# NOTE:
# - `update = true`: Automated updates run nix-update via update-local-packages.yml.
# - `update = false`: Either managed outside nix-update (e.g. Renovate for flake inputs) or locally maintained.
# - Binary caching is automatically handled by `cmd/ci-build` based on licenses.
#   Do NOT configure caching flags here.

[packages]
antigravity-cli = { build = true, test = true, update = true }
cloudflare-warp = { build = false, test = false, update = true }
conoha-cli = { build = true, test = true, update = true }
filen-cli-rs = { build = true, test = true, update = true }
gh-actions-lock = { build = true, test = true, update = true }
ghadiag = { build = true, test = true, update = false } # Flake input, updated by Renovate
git-hooks-pre-push = { build = true, test = true, update = false }
hcpu_shogi = { build = true, test = true, update = false }
ibus-engine-selector = { build = true, test = true, update = false }
iets = { build = true, test = true, update = false } # Flake input, updated by Renovate
kanata-tray = { build = true, test = true, update = false } # Flake input, updated by Renovate
leaf-markdown-viewer = { build = true, test = true, update = true }
lima = { build = false, test = false, update = true }
lima-full = { build = true, test = true, update = false }
nix-update = { build = true, test = true, update = false } # Follows nixpkgs flake input
reponame = { build = true, test = true, update = false }
yaneuraou-avx2 = { build = true, test = true, update = false }
zed-editor = { build = true, test = false, update = false } # Follows nixpkgs flake input
