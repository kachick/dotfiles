name: ❄️ Diff
on:
  pull_request:
    paths:
      - 'flake.lock'
      - '.github/workflows/nix-diff.yml'

permissions:
  contents: read

jobs:
  diff:
    permissions:
      contents: read
      pull-requests: write
    uses: kachick/workflows/.github/workflows/reusable-nix-diff-closures.yml@main
    with:
      runs-on: ubuntu-26.04
      targets: |
        devShells.x86_64-linux.default
        nixosConfigurations.algae.config.system.build.toplevel
        homeConfigurations."github-actions@ubuntu-26.04".activationPackage
