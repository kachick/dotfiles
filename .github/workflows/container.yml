name: ⬢🦭
on:
  push:
    tags:
      - 'v*'
    # Don't add branch triggers; this workflow is resource-intensive and requires considering concurrency.
    # branches:
    #   - main
  # Label-triggered PR runs live in labeler.yml so unrelated labels do not start or cancel this workflow
  workflow_call:
  schedule:
    # Every 23:42 JST # GitHub does not guarantee that workflows start at the scheduled time, even if set to end-of-day(23:59).
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The image name in GHCR
  IMAGE_NAME: home
  # The base URL for GHCR
  GHCR_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  # podman can handle lowercase. So normalize the outputs
  get-meta:
    name: 📋 Meta
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.timestamp.outputs.started_at }}
      ref_tag: ${{ steps.tags.outputs.ref }}
      special_tag: ${{ steps.tags.outputs.special }}
      timestamp_tag: ${{ steps.tags.outputs.timestamp }}
      require_comments: ${{ steps.comments.outputs.require }}
    steps:
      - name: Get started timestamp
        id: timestamp
        run: |
          # Do not use ":" delimiter as iso-8601/rfc-3339, it cannot be used in container tag
          echo started_at="$(date --utc '+%Y%m%d-%H%M%S-%Z')" | ruby -pe '$_.downcase!' | tee -a "$GITHUB_OUTPUT"
      - name: Judge to post comments or not
        id: comments
        if: >-
          (github.actor == github.repository_owner) && (github.event_name == 'pull_request')
        run: echo -n 'require=true' | tee -a "$GITHUB_OUTPUT"
      - name: Generate tags for the image
        id: tags
        # https://github.com/orgs/community/discussions/26557#discussioncomment-3252327
        env:
          STARTED_AT: ${{ steps.timestamp.outputs.started_at }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          echo "timestamp=${STARTED_AT}" | tee -a "$GITHUB_OUTPUT"

          special=''
          ref=''

          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            special="pr-${PR_NUMBER}-${PR_HEAD_SHA}"
            ref="${PR_HEAD_SHA}"
          elif [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            special='latest'
            ref="${SHA}"
          else
            exit 1
          fi

          echo "special=${special}" | tee -a "$GITHUB_OUTPUT"
          echo "ref=${ref}" | tee -a "$GITHUB_OUTPUT"
  minimize-old-comments:
    needs: [get-meta]
    if: ${{ needs.get-meta.outputs.require_comments == 'true' }}
    permissions:
      contents: read # Required for actions/checkout in reusable workflow
      pull-requests: write # Required for minimizing outdated PR comments
    uses: kachick/workflows/.github/workflows/reusable-minimize-pr-comments.yml@main # zizmor: ignore[unpinned-uses]
    with:
      pr-number: ${{ github.event_name == 'pull_request' && github.event.number || 0 }}
      body-includes: 'containers/sandbox.bash'
  build_and_push:
    name: 🔨📤 Build & Push
    # Do not set `cancel-in-progress: true` in main branch, it displays failure badges
    # https://github.com/orgs/community/discussions/8336
    concurrency:
      group: 'deploy-container-${{ github.ref }}'
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [get-meta, minimize-old-comments]
    if: >-
      (! failure()) &&
      ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-staging')) ||
      (github.event_name != 'pull_request'))
    permissions:
      contents: read
      packages: write # Required for pushing container images to GHCR
      pull-requests: write # Required for posting deploy comments
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Logging disk space
        run: df -h
      - name: Logging dependency versions
        run: |
          podman version
          crun --version
          buildah version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build base Image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: systemd-prepared
          tags: ${{ needs.get-meta.outputs.ref_tag }}
          containerfiles: |
            containers/Containerfile
          oci: true
      - name: Inspect the created image
        env:
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
        run: podman inspect "systemd-prepared:${REF_TAG}"
      - name: Start systemd
        id: start-systemd
        env:
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
        run: |
          set -euxo pipefail
          container_id="$(podman run --detach --rm "systemd-prepared:${REF_TAG}")"
          echo container_id="$container_id" | tee -a "$GITHUB_OUTPUT"
      - name: Wait for the systemd to be ready
        run: 'sleep 2'
      - name: Run Nix commands and cleanup provisioners
        env:
          CONTAINER_ID: ${{ steps.start-systemd.outputs.container_id }}
        run: |
          set -euxo pipefail
          podman exec --user=root -it "${CONTAINER_ID}" nix run '/provisioner/dotfiles#apply-system'
          podman exec --user=user -it "${CONTAINER_ID}" /provisioner/needs_systemd.bash
          podman exec --user=root -it "${CONTAINER_ID}" rm -rf /provisioner
      - name: Check no personal name in that config
        env:
          CONTAINER_ID: ${{ steps.start-systemd.outputs.container_id }}
        run: |
          # https://unix.stackexchange.com/a/340729
          assign_stdin_to_global_command_variable() {
            command="$(cat)"
          }

          assign_stdin_to_global_command_variable <<'EOF'
          set -uxo
          # https://unix.stackexchange.com/questions/311090/how-to-disable-set-x
          set +e
          /home/user/.nix-profile/bin/rg --hidden --follow --glob='!.local/state' --glob='!.nix-*' 'kachick1'
          # Need to check the exit code if we want to make sure "not found" in grep family
          # https://github.com/BurntSushi/ripgrep/issues/1290#issuecomment-761170095

          ripgrep_exit_code="$?" # Do not directly use the $? to prevent inserting another command as a human error
          [[ "$ripgrep_exit_code" -eq 1 ]]
          EOF

          podman exec --user=user --workdir=/home/user -it "${CONTAINER_ID}" bash -c "$command"
      - name: Persist the container to image
        env:
          AUTHOR: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTAINER_ID: ${{ steps.start-systemd.outputs.container_id }}
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
          SPECIAL_TAG: ${{ needs.get-meta.outputs.special_tag }}
          TIMESTAMP_TAG: ${{ needs.get-meta.outputs.timestamp_tag }}
        run: |
          podman commit \
            --author "${AUTHOR}" \
            "${CONTAINER_ID}" "home:${REF_TAG}"
          podman kill "${CONTAINER_ID}"
          podman tag "home:${REF_TAG}" "home:${SPECIAL_TAG}"
          podman tag "home:${REF_TAG}" "home:${TIMESTAMP_TAG}"
      - name: Inspect the created image
        env:
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
        run: podman inspect "home:${REF_TAG}"
      - name: Test the created image
        env:
          STARTED_AT: ${{ needs.get-meta.outputs.started_at }}
        run: |
          set -euxo pipefail
          container_id="$(podman run --detach --rm "home:${STARTED_AT}")"
          # shellcheck disable=SC2064
          trap "podman kill '$container_id'" EXIT ERR
          sleep 2 # Wait for the systemd to be ready
          podman exec --user=user "$container_id" cat /etc/nix/nix.conf
          podman exec --user=user "$container_id" '/home/user/.nix-profile/bin/bash' -c 'which fd'
          podman exec --user=user --workdir='/home/user' -it "$container_id" '/home/user/.nix-profile/bin/zsh' -c 'la; lat ~/.config'
      - name: Push To ghcr.io
        id: push-to-ghcr
        if: ${{ github.actor == github.repository_owner }}
        env:
          SPECIAL_TAG: ${{ needs.get-meta.outputs.special_tag }}
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
          TIMESTAMP_TAG: ${{ needs.get-meta.outputs.timestamp_tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          tags="${SPECIAL_TAG} ${REF_TAG} ${TIMESTAMP_TAG}"
          registry="${GHCR_BASE}"
          image_name="${IMAGE_NAME}"

          for tag in $tags; do
            full_image_name="${registry}/${image_name}:${tag}"
            podman tag "${image_name}:${REF_TAG}" "${full_image_name}"
            # Using --creds to avoid podman login
            # --digestfile is used to capture the digest for the next step
            podman push --compression-format=zstd --creds="${REPO_OWNER}:${GITHUB_TOKEN}" --digestfile=digest.txt "${full_image_name}"
          done

          # Capture the digest of the last pushed tag (they should all have the same digest since they are the same image)
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"
      - name: Inspect the package
        id: inspect-package
        if: ${{ github.actor == github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_OUTPUTS: ${{ toJSON(steps.push-to-ghcr.outputs) }}
          REPO_OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push-to-ghcr.outputs.digest }}
        run: | # shell
          #
          set -euxo pipefail

          echo "${PUSH_OUTPUTS}"

          {
            echo 'json<<JSON'

            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${REPO_OWNER}/packages/container/home/versions" | \
              jq --arg digest "${DIGEST}" '.[] | select(.name == $digest)'

            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"

      - name: Post comments
        if: ${{ needs.get-meta.outputs.require_comments == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: | # zizmor: ignore[template-injection]
          (
          cat <<'EOF'
          ⬢🦭 Staging container-image has been deployed 🚀\
          You can test the interactive shell 🐚 as follows.

          ```bash
          bash <(curl -fsSL 'https://raw.githubusercontent.com/kachick/dotfiles/${{ github.event.pull_request.head.sha }}/containers/sandbox.bash') --ghcr '${{ github.event.pull_request.head.sha }}'
          ```

          The package detail

          ```json
          ${{ steps.inspect-package.outputs.json }}
          ```

          This image will be automatically 🤖 removed from ghcr.io 🗑️ if you merged/closed this PR 😌
          EOF
          ) | gh pr comment ${{ github.event.number }} --body-file -

      - name: Logging disk space
        run: df -h

  remove-old-images:
    needs: [build_and_push]
    # Always skips if no conditions
    if: always() && (needs.build_and_push.result == 'success')
    permissions:
      packages: write # Required for deleting old GHCR package versions
    uses: kachick/workflows/.github/workflows/reusable-cleanup-ghcr.yml@main # zizmor: ignore[unpinned-uses]
    with:
      package-name: home
      keep-latest-items: 50 # 50 is adjusted for https://ghcr.io/v2/kachick/home/tags/list behavior
