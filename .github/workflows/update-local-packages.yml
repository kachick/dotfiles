name: 🆙 local packages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-local-packages.yml'
  schedule:
    - cron: '2 9 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  DEFAULT_BRANCH: main

jobs:
  create-pr:
    name: 🆙 Create PR
    permissions:
      contents: write # Required for pushing branches and creating PRs
    strategy:
      fail-fast: false
      matrix:
        package:
          # BEGIN MANAGED PACKAGES
          - antigravity-cli
          - antigravity-hub
          - cloudflare-warp
          - conoha-cli
          - filen-cli-rs
          - gh-actions-lock
          - leaf-markdown-viewer
          - lima
          - multios-usb
          - shuck
          # END MANAGED PACKAGES
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PR_BRANCH: bot-update-${{ matrix.package }}
    steps:
      # To push workflow changes and trigger CIs
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # Required to set workflow permission for the APP
          # Why replaced from secrets?: https://github.com/github/docs/commit/eaac671cdd9189afd410366e9eb5edd4ee815194#diff-19d2b329775bf781d0cf19fabafa7f231bd85f133cbf9e23594036ea68f7021dL53-R54
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to get commit counts
          # https://stackoverflow.com/a/65056108
          fetch-depth: 0
          # Needed to specify token for checkout phase, only in pushing phase is too late
          # https://github.com/orgs/community/discussions/27072#discussioncomment-3254515
          token: ${{ steps.publish-token.outputs.token }}
          # This value is explicitly set to true, even though it is the default for actions/checkout.
          # Many linters recommend setting this to false, and most users have requested it as the new default (see https://github.com/actions/checkout/issues/485).
          # However, this workflow depends on the stored credentials for the subsequent git push command.
          # For this reason, true is required for now.
          persist-credentials: true
      - name: Fetch active PRs by me
        id: fetch-active-prs
        env:
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          count="$(gh pr list --author "@me" --state open --head "${PR_BRANCH}" --json number --jq 'length')"
          echo "count=${count}" | tee -a "$GITHUB_OUTPUT"
      - name: Prepare Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare Git branch
        run: |
          git switch -C "${PR_BRANCH}" "origin/${DEFAULT_BRANCH}"

      - uses: $/.github/actions/setup-nix

      - name: Install dependencies
        run: |
          nix profile add '.#nix-update'

      # Perform evaluation before nix-update to ensure IFD (like patched nixpkgs) is built and valid in store.
      # This addresses the "path ...-patched-nixpkgs-unstable.drv is not valid" error in GHA.
      - name: Pre-evaluate package
        run: |
          nix eval --raw --impure ".#${PACKAGE}.pname"
        env:
          PACKAGE: ${{ matrix.package }}
          NIXPKGS_ALLOW_UNFREE: '1'

      # Use manual commit because `nix-update --commit` performs strict evaluation
      # which causes "path ... is not valid" errors in GHA for patched nixpkgs.
      - name: Update packages
        run: |
          msg_file="$(mktemp)"
          if [[ "${PACKAGE}" == "antigravity-cli" || "${PACKAGE}" == "antigravity-hub" ]]; then
            old_version="$(nix eval --raw --impure ".#${PACKAGE}.version")"
            nix run --impure ".#${PACKAGE}.passthru.updateScript"
            new_version="$(nix eval --raw --impure ".#${PACKAGE}.version")"
            if [[ "${old_version}" != "${new_version}" ]]; then
              echo "${PACKAGE}: ${old_version} -> ${new_version}" > "${msg_file}"
              changelog="$(nix eval --raw --impure ".#${PACKAGE}.meta.changelog" 2>/dev/null || true)"
              if [[ -n "${changelog}" ]]; then
                printf '\nChangelog: %s\n' "${changelog}" >> "${msg_file}"
              fi
            fi
          else
            nix-update --flake "${PACKAGE}" --use-update-script --write-commit-message "${msg_file}"
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            if [[ -s "${msg_file}" ]]; then
              git commit --file "${msg_file}"
            else
              git commit -m "${PACKAGE}: update"
            fi
          fi
          rm "${msg_file}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          NIXPKGS_ALLOW_UNFREE: '1'

      - name: Count added commits
        id: count-commits
        run: |
          count="$(git rev-list --count "origin/${DEFAULT_BRANCH}..")"
          echo "count=${count}" | tee -a "$GITHUB_OUTPUT"
          case "${count}" in
            0)
              ;;
            1)
              echo "title=$(git log -1 --format=%s)" | tee -a "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected commit count: ${count}"
              exit 1
              ;;
          esac
      - run: git push origin "${PR_BRANCH}" --force
        if: steps.count-commits.outputs.count > 0
      - name: Create PR
        if: (steps.count-commits.outputs.count > 0) && (steps.fetch-active-prs.outputs.count == 0)
        env:
          GITHUB_TOKEN: '${{ steps.publish-token.outputs.token }}'
          PR_TITLE: ${{ steps.count-commits.outputs.title }}
          PR_BODY: |
            Updating ${{ matrix.package }} to the latest version.
        run: |
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}"

  update-container-base:
    name: 🆙 Update container base image
    permissions:
      contents: write # Required for pushing branches and creating PRs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PR_BRANCH: bot-update-container-base
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token }}
          persist-credentials: true

      - name: Fetch active PRs by me
        id: fetch-active-prs
        env:
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          count="$(gh pr list --author "@me" --state open --head "${PR_BRANCH}" --json number --jq 'length')"
          echo "count=${count}" | tee -a "$GITHUB_OUTPUT"

      - name: Prepare Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Git branch
        run: |
          git switch -C "${PR_BRANCH}" "origin/${DEFAULT_BRANCH}"

      - uses: $/.github/actions/setup-nix

      - name: Update base image digest and hash
        run: |
          nix run '.#container-layered.passthru.updateScript'
          if [[ -n "$(git status --porcelain)" ]]; then
            git add containers/base-image.json
            git commit -m "Update container base image digest"
          fi

      - name: Count added commits
        id: count-commits
        run: |
          count="$(git rev-list --count "origin/${DEFAULT_BRANCH}..")"
          echo "count=${count}" | tee -a "$GITHUB_OUTPUT"
          case "${count}" in
            0)
              ;;
            1)
              echo "title=$(git log -1 --format=%s)" | tee -a "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected commit count: ${count}"
              exit 1
              ;;
          esac

      - run: git push origin "${PR_BRANCH}" --force
        if: steps.count-commits.outputs.count > 0

      - name: Create PR
        if: (steps.count-commits.outputs.count > 0) && (steps.fetch-active-prs.outputs.count == 0)
        env:
          GITHUB_TOKEN: '${{ steps.publish-token.outputs.token }}'
          PR_TITLE: ${{ steps.count-commits.outputs.title }}
          PR_BODY: |
            Updating container base image digest and hash in `containers/base-image.json`.
        run: |
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}"
