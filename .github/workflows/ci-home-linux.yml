name: ❄️🏠 🐧
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-home-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'home-manager/**'
      - 'flake.*'
      - 'pkgs/**'
      - 'go.*'
      - '!**.md'
  pull_request:
    paths:
      - '.github/workflows/ci-home-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'home-manager/**'
      - 'flake.*'
      - 'pkgs/**'
      - 'go.*'
      - '!**.md'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  home-manager:
    name: ❄️🏠 Home Manager
    permissions:
      contents: read
      id-token: write # Required for Tailscale and niks3 OIDC authentication
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    env:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - name: Logging disk space before build
        run: df -h

      - name: Print some dotfiles overviews
        run: |
          </etc/nix/nix.conf
          ls -alh ~

      # https://www.reddit.com/r/Nix/comments/1443k3o/comment/jr9ht5g/?utm_source=reddit&utm_medium=web2x&context=3
      - run: mkdir -p ~/.local/state/nix/profiles
      - run: nix run .#home-manager -- switch -b backup --flake ".#github-actions@${RUNNER}"
        env:
          RUNNER: ${{ matrix.runner }}
      - run: zsh -c 'sudo --preserve-env=PATH env nix run ".#apply-system"'
      - name: Print some paths and versions
        run: |
          which zsh
          which bash
          which ruby
          which irb
          which ssh
      - name: Make sure the $PATH for bash is not overridden as like the `path_helper`. See https://github.com/kachick/dotfiles/issues/503
        run: |
          [[ "$(zsh -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
          [[ "$(bash -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
      # Do not use interactive mode here.
      # Solutions as https://github.com/actions/runner/issues/241#issuecomment-924327172 will not fit with several problems
      - name: Run customized dependencies
        run: |
          zsh -c zsh -c 'which la; which p'
          zsh -c 'starship --version'
          zsh -c 'ruby --version'
          zsh -c 'irb --version'
          zsh -c 'ssh -V'
          zsh -c 'hx --health'
      - name: Run homemade commands
        run: |
          zsh -c 'la ~; lat ~/.config'
          zsh -c "p neo-cowsay hello --command 'cowsay --rainbow \$(hello)'"
      - name: Connect Tailscale
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
      - name: Push home-manager generation to niks3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: |
          PIN_ARGS=()
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PIN_ARGS=(--pin dotfiles-main-home-manager)
          fi
          go run ./cmd/ci-build push "${PIN_ARGS[@]}" ~/.local/state/nix/profiles/home-manager
