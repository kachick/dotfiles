name: Lima Guest Provisioning Test

on:
  push:
    branches: [main]
    paths:
      - 'config/lima/**'
      - 'home-manager/lima-*.nix'
      - 'nixos/nix.nix'
      - 'pkgs/by-name/ge/gen-nix-cache-conf/**'
      - 'scripts/install-nix.bash'
      - '.github/workflows/lima-guest.yml'
  pull_request:
    paths:
      - 'config/lima/**'
      - 'home-manager/lima-*.nix'
      - 'nixos/nix.nix'
      - 'pkgs/by-name/ge/gen-nix-cache-conf/**'
      - 'scripts/install-nix.bash'
      - '.github/workflows/lima-guest.yml'
  workflow_dispatch:
  schedule:
    # Every 10:42 on Tuesday JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # IMPORTANT: These jobs MUST remain split.
  # GitHub Actions only saves the cache if the job completes successfully.
  prepare-image:
    name: 📦 Prepare Image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        id: lima-setup
        with:
          version: 'latest'

      - name: Cache Lima
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/lima
            ~/.lima
          key: lima-${{ steps.lima-setup.outputs.version }}
          restore-keys: |
            lima-${{ steps.lima-setup.outputs.version }}-

      - name: Setup Lima templates
        run: |
          mkdir -p ~/.lima/_templates/_default
          cp config/lima/_templates/_default/mounts.yaml ~/.lima/_templates/_default/
          cp config/lima/_templates/docker-nix.yaml ~/.lima/_templates/

      - name: Create Lima Instance from custom template
        env:
          REV: ${{ github.head_ref || github.ref_name }}
        run: |
          limactl delete -f docker-nix || true
          limactl create --yes --name=docker-nix --param dotfilesRev="${REV}" --param githubToken="${{ github.token }}" template:docker-nix

  test-provisioning:
    name: 🧪 Test Provisioning
    needs: prepare-image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        id: lima-setup
        with:
          version: 'latest'

      - name: Cache Lima
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/lima
            ~/.lima
          key: lima-${{ steps.lima-setup.outputs.version }}
          restore-keys: |
            lima-${{ steps.lima-setup.outputs.version }}-

      - name: Setup Lima templates
        run: |
          mkdir -p ~/.lima/_templates/_default
          cp config/lima/_templates/_default/mounts.yaml ~/.lima/_templates/_default/
          cp config/lima/_templates/docker-nix.yaml ~/.lima/_templates/

      - name: Start docker-nix
        run: limactl start --name=docker-nix --tty=false

      - name: Verify Nix installation in Guest
        run: limactl shell docker-nix nix --version

      - name: Show Binary Cache effectiveness in Guest
        env:
          REV: ${{ github.head_ref || github.ref_name }}
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          FLAKE_URI="github:kachick/dotfiles/${REV}"
          limactl shell docker-nix env NIX_CONFIG="${NIX_CONFIG}" nix run "${FLAKE_URI}#la" -- --version

      - name: Show Docker works in Guest
        run: limactl shell docker-nix docker run --rm hello-world
