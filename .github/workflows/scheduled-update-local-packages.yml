name: 📅🆙 local packages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-update-local-packages.yml'
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    # Every day 9:17 JST
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-packages:
    permissions:
      contents: write # Required for updating and pushing local package changes
    uses: $/.github/workflows/update-local-packages.yml
    secrets:
      PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
