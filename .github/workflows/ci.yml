name: CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'home-manager/**'
      - 'nixos/**'
      - 'flake.*'
      - 'overlays/**'
      - 'go.*'
      - 'packages.toml'
      - '!**.md'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'home-manager/**'
      - 'nixos/**'
      - 'flake.*'
      - 'overlays/**'
      - 'go.*'
      - 'packages.toml'
      - '!**.md'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Logging disk space
        run: df -h
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skip-push: true
      - parallel:
          # BEGIN MANAGED PACKAGES
          - name: antigravity-cli
            run: go run ./cmd/ci-build package antigravity-cli

          - name: archive-home-files
            run: go run ./cmd/ci-build package archive-home-files

          - name: conoha-cli
            run: go run ./cmd/ci-build package conoha-cli

          - name: filen-cli-rs
            run: go run ./cmd/ci-build package filen-cli-rs

          - name: gh-actions-lock
            run: go run ./cmd/ci-build package gh-actions-lock

          - name: git-hooks-pre-push
            run: go run ./cmd/ci-build package git-hooks-pre-push

          - name: hcpu_shogi
            run: go run ./cmd/ci-build package hcpu_shogi

          - name: ibm-plex-mono
            run: go run ./cmd/ci-build package ibm-plex-mono

          - name: ibm-plex-sans-jp
            run: go run ./cmd/ci-build package ibm-plex-sans-jp

          - name: ibm-plex-serif-variable
            run: go run ./cmd/ci-build package ibm-plex-serif-variable

          - name: ibus-engine-selector
            run: go run ./cmd/ci-build package ibus-engine-selector

          - name: kanata-tray
            run: go run ./cmd/ci-build package kanata-tray

          - name: lima-full
            run: go run ./cmd/ci-build package lima-full

          - name: mozc
            run: go run ./cmd/ci-build package mozc

          - name: nix-diff
            run: go run ./cmd/ci-build package nix-diff

          - name: reponame
            run: go run ./cmd/ci-build package reponame

          - name: yaneuraou-avx2
            run: go run ./cmd/ci-build package yaneuraou-avx2

          - name: zed-editor
            run: go run ./cmd/ci-build package zed-editor --skip-tests
          # END MANAGED PACKAGES

  home-manager:
    needs: [packages]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - name: Clean disk space as per https://github.com/actions/virtual-environments/issues/709
        # NOTE: This workflow removed 14 Gib in 50sec
        # On the otherhand, additional apt purge step removed 6 Gib in 100s, so I don't want to use the additional steps for now
        run: |
          docker image prune --all --force
          sudo rm -rf '/opt/ghc' \
            '/usr/share/dotnet' \
            "$AGENT_TOOLSDIRECTORY" \
             '/usr/local/lib/android' \
             '/usr/local/share/boost'
      - name: Logging disk space after clean
        run: df -h
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Print some dotfiles overviews
        run: |
          </etc/nix/nix.conf
          ls -alh ~

      # https://www.reddit.com/r/Nix/comments/1443k3o/comment/jr9ht5g/?utm_source=reddit&utm_medium=web2x&context=3
      - run: mkdir -p ~/.local/state/nix/profiles
      - run: nix run .#home-manager -- switch -b backup --flake '.#github-actions@${{ matrix.runner }}'
      - run: zsh -c 'sudo --preserve-env=PATH env nix run ".#apply-system"'
      - name: Print some paths and versions
        run: |
          which zsh
          which bash
          which ruby
          which irb
          which ssh
      - name: Make sure the $PATH for bash is not overridden as like the `path_helper`. See https://github.com/kachick/dotfiles/issues/503
        run: |
          [[ "$(zsh -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
          [[ "$(bash -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
      # Do not use interactive mode here.
      # Solutions as https://github.com/actions/runner/issues/241#issuecomment-924327172 will not fit with several problems
      - name: Run customized dependencies
        run: |
          zsh -c zsh -c 'which la; which p'
          zsh -c 'starship --version'
          zsh -c 'ruby --version'
          zsh -c 'irb --version'
          zsh -c 'ssh -V'
          zsh -c 'hx --health'
      - name: Run homemade commands
        run: |
          zsh -c 'la ~; lat ~/.config'
          zsh -c "p neo-cowsay hello --command 'cowsay --rainbow \$(hello)'"
      - name: Backup generated config
        run: |
          nix run .#archive-home-files 'home-manager-generation-home-files-${{ matrix.runner }}'
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: home-manager-generation-home-files-${{ matrix.runner }}.tar.gz.age
          if-no-files-found: 'error'
          archive: false

  nixos:
    needs: [packages]
    # Run if:
    # 1. It's not a pull request (push, schedule, etc.)
    # 2. It's a pull request and:
    #    - The 'nixos-rebuild' label is attached
    #    - OR it was triggered by paths (action != labeled)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'nixos-rebuild') ||
        github.event.action != 'labeled'
      ))
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - name: Clean disk space as per https://github.com/actions/virtual-environments/issues/709
        # NOTE: This workflow removed 14 Gib in 50sec
        # On the otherhand, additional apt purge step removed 6 Gib in 100s, so I don't want to use the additional steps for now
        run: |
          docker image prune --all --force
          sudo rm -rf '/opt/ghc' \
            '/usr/share/dotnet' \
            "$AGENT_TOOLSDIRECTORY" \
             '/usr/local/lib/android' \
             '/usr/local/share/boost'
      - name: Logging disk space after clean
        run: df -h
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - parallel:
          - name: Build NixOS - vps
            run: go run ./cmd/ci-build nixos vps

          - name: Build NixOS - desktop-free
            run: go run ./cmd/ci-build nixos desktop-free

          - name: Build NixOS - wsl
            run: go run ./cmd/ci-build nixos wsl

  test-sample-nixos:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Install direnv
        run: |
          url="$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.url')"
          nix profile add "${url}#direnv"
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"

      - name: Verify sample configuration template
        # Use direnv or `nix develop` to ensure `task` is available from devShell
        run: task test-sample-nixos
