# Separated from container.yml to avoid mixing heavy build triggers and pull request close cleanup.
# This keeps concurrency control simple and makes Actions run logs easy to follow.
name: 👋 staging ⬢🗑️

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Target PR number'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: 🗑️ Staging
    if: (github.event_name != 'pull_request') || (github.event.pull_request.merged == true)
    permissions:
      contents: read # Required for actions/checkout in reusable workflow
      pull-requests: write # Required for minimizing outdated comments and posting result
      packages: write # Required for deleting staging package versions
    uses: kachick/workflows/.github/workflows/reusable-cleanup-ghcr-staging.yml@main # zizmor: ignore[unpinned-uses]
    with:
      package-name: home
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr-number }}
      body-includes: 'containers/sandbox.bash'
