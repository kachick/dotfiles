name: 🤖👌🤖
on:
  schedule:
    # Run every 2 hours at minute 17 to avoid traffic peaks
    - cron: '17 */2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/merge-bot-pr.yml'

permissions:
  contents: read

jobs:
  automerge:
    uses: kachick/workflows/.github/workflows/reusable-automerge.yml@main
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      llm-veto: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
