name: 🆙❄️
on:
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    # Every Monday 9:17 JST
    - cron: '17 0 * * 1'
    # # Every Wednesday 9:17 JST
    # - cron: '17 0 * * 3'
    # # Every Friday 9:17 JST
    # - cron: '17 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: kachick/workflows/.github/workflows/reusable-bump-flake-lock.yml@main # zizmor: ignore[unpinned-uses]
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      post-commit-lock-file: nix run .#post-bump-flake-lock
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
