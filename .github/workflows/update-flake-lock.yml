name: 🆙❄️
on:
  schedule:
    - cron: '17 9 * * 1-6' # Keep in sync with flake-inputs below (Mon-Sat: nixpkgs only)
      timezone: 'Asia/Tokyo'
    - cron: '17 9 * * 0' # Sun: all inputs
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  bump:
    uses: kachick/workflows/.github/workflows/reusable-bump-flake-lock.yml@main # zizmor: ignore[unpinned-uses]
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      flake-inputs: ${{ github.event_name == 'schedule' && github.event.schedule == '17 9 * * 1-6' && 'nixpkgs' || '' }} # Keep in sync with schedule cron above
      post-commit-lock-file: nix run .#dedup-flake-inputs && nix run .#bump_gomod -- . cmd/winit-reg
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
