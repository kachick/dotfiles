name: 🆙❄️
on:
  pull_request:
    paths:
      - '.github/workflows/update-flake-lock.yml'
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    # Every Monday 9:17 JST
    - cron: '17 0 * * 1'
    # # Every Wednesday 9:17 JST
    # - cron: '17 0 * * 3'
    # # Every Friday 9:17 JST
    # - cron: '17 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: kachick/workflows/.github/workflows/reusable-bump-flake-lock.yml@main # zizmor: ignore[unpinned-uses]
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      # Fallback to bump_gomod when tested on PRs before post-bump-flake-lock.bash lands on the default branch
      post-commit-lock-file: |
        if [ -f ./scripts/post-bump-flake-lock.bash ]; then
          ./scripts/post-bump-flake-lock.bash
        else
          nix run .#bump_gomod -- .
        fi
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
