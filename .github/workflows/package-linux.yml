# https://github.com/NixOS/nixos-artwork/blob/35ebbbf01c3119005ed180726c388a01d4d1100c/logo/README.md#L5
name: ❄️📦 🐧
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'flake.lock'
      - 'overlays/**'
      - 'packages.toml'
      - '!**.md'
  pull_request:
    paths:
      - '.github/workflows/package-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'flake.lock'
      - 'overlays/**'
      - 'packages.toml'
      - '!**.md'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Logging disk space
        run: df -h
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skip-push: true
      - name: Build and push packages
        run: go run ./cmd/ci-build packages
