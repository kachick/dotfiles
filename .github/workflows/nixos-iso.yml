name: 💿 NixOS ISO
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    # Every 12:42 JST
    - cron: '42 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build
    # Trigger on:
    # 1. Schedule or manual dispatch
    # 2. Pull request ONLY IF the 'nixos-iso' label is present
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nixos-iso'))
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Logging disk space before build
        run: df -h
      - name: Build NixOS ISO
        run: |
          nix build ".#nixosConfigurations.installer.config.system.build.isoImage" --show-trace
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          path: result/iso/*.iso
          archive: false
