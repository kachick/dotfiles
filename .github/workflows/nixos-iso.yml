name: 💿 NixOS ISO
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    # Every 12:42 JST
    - cron: '42 3 * * *'

permissions:
  contents: read
  actions: read # Detect evicted cache entries upfront in hestia

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build
    # Trigger on:
    # 1. Schedule or manual dispatch
    # 2. Pull request ONLY IF the 'nixos-iso' label is present
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nixos-iso'))
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          # ISO image closure is huge and artifact is uploaded separately
          hestia-read-only: 'true'
      - name: Logging disk space before build
        run: df -h
      - name: Build NixOS ISO
        run: |
          nix build ".#nixosConfigurations.installer.config.system.build.isoImage" --show-trace
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: result/iso/*.iso
          archive: false
