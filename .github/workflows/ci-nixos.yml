name: ❄️ NixOS CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-nixos.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'nixos/**'
      - 'flake.*'
      - '!**.md'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-nixos.yml'
      - '.github/actions/setup-nix/**'
      - 'cmd/ci-build/**'
      - 'nixos/**'
      - 'flake.*'
      - '!**.md'
  workflow_dispatch:
  schedule:
    # Every 10:42 JST
    - cron: '42 1 * * *'

permissions:
  contents: read

# Ensure only one run per branch/PR at a time.
# Queue new runs instead of cancelling existing ones to ensure heavy builds complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait:
    name: ⏳ Wait
    runs-on: ubuntu-26.04
    steps:
      - name: Wait other jobs to leverage binary caches
        uses: kachick/wait-other-jobs@v4
        timeout-minutes: 180
        with:
          # Only wait for workflows that provide binary caches to avoid deadlocks
          wait-list: |
            [
              { "workflowFile": "package-linux.yml", "optional": true }
            ]
          event-list: '[ "${{ github.event_name }}", "dynamic" ]'

  build:
    name: 🔨 Build
    needs: [wait]
    permissions:
      contents: read
      id-token: write # Required for Tailscale and niks3 OIDC authentication
    # Run if:
    # 1. Previous 'wait' job succeeded OR was skipped (non-PR case).
    # 2. It's not a pull request (push, schedule, etc.)
    # 3. It's a pull request and:
    #    - The 'nixos-rebuild' label is attached
    #    - OR it was triggered by paths (action != labeled)
    if: >-
      always() &&
      (needs.wait.result == 'success' || needs.wait.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       (github.event_name == 'pull_request' && (
         contains(github.event.pull_request.labels.*.name, 'nixos-rebuild') ||
         github.event.action != 'labeled'
       )))
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CI_BUILD_OUT_PATHS_DIR: /tmp/ci-build-out-paths
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - name: Logging disk space before build
        run: df -h
      - parallel:
          - name: Build NixOS - desktop-free
            run: go run ./cmd/ci-build nixos desktop-free

          - name: Build NixOS - wsl
            run: go run ./cmd/ci-build nixos wsl
      - name: Connect Tailscale
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
      - name: Push build closures to niks3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: go run ./cmd/ci-build push --from-dir "$CI_BUILD_OUT_PATHS_DIR"
      - name: Pin NixOS desktop-free on main
        if: ${{ github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: |
          TOPLEVEL=$(nix eval --raw .#nixosConfigurations.desktop-free.config.system.build.toplevel)
          go run ./cmd/ci-build pin dotfiles-main-nixos-desktop-free "$TOPLEVEL"

  test-sample:
    name: 🧪 Test Sample
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix

      - name: Install direnv
        run: |
          nix profile add --inputs-from . nixpkgs#direnv
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"

      - name: Verify sample configuration template
        # Use direnv or `nix develop` to ensure `task` is available from devShell
        run: task test-sample-nixos
