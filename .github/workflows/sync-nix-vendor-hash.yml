name: 🔄 Sync Nix vendorHash
on:
  schedule:
    # Run every 2 hours at minute 47 to avoid traffic peaks and prepare bot PRs before automerge runs at minute 17
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-hash:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.publish-token.outputs.token }}
          persist-credentials: true

      - uses: $/.github/actions/setup-nix

      - name: Prepare Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync vendorHash for open Dependabot PRs
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          set -euo pipefail

          branches=$(gh pr list \
            --author "app/dependabot" \
            --state open \
            --json headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/go_modules/")) | .headRefName')

          if [ -z "${branches}" ]; then
            echo "No open Dependabot Go PRs found"
            exit 0
          fi

          for branch in ${branches}; do
            echo "Checking ${branch}..."
            git fetch origin "${branch}"
            git checkout -B "${branch}" "origin/${branch}"
            git reset --hard HEAD
            git clean -fd

            if [ "$(git log -1 --format=%s)" = "Bump vendorHash in go packages" ]; then
              echo "Branch ${branch} is already synced"
              continue
            fi

            before_sha=$(git rev-parse HEAD)
            nix run .#bump_gomod -- .

            if [ "$(git rev-parse HEAD)" != "${before_sha}" ]; then
              echo "Pushing updated vendorHash for ${branch}..."
              git push origin "${branch}"
            else
              echo "No vendorHash changes needed for ${branch}"
            fi
          done
