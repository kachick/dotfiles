name: ❄️📦🏠 🐧
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nix.yml'
      - '.github/actions/setup-nix/**'
      - '.github/actions/clean-disk/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'home-manager/**'
      - 'nixos/**'
      - 'flake.*'
      - 'overlays/**'
      - 'go.*'
      - '!**.md'
  pull_request:
    paths:
      - '.github/workflows/nix.yml'
      - '.github/actions/setup-nix/**'
      - '.github/actions/clean-disk/**'
      - 'cmd/ci-build/**'
      - 'pkgs/**'
      - 'home-manager/**'
      - 'nixos/**'
      - 'flake.*'
      - 'overlays/**'
      - 'go.*'
      - '!**.md'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  packages:
    name: 📦 Packages
    permissions:
      contents: read
      actions: read # Detect evicted cache entries upfront in hestia
      id-token: write # Required for Tailscale and niks3 OIDC authentication
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CI_BUILD_OUT_PATHS_DIR: /tmp/ci-build-out-paths
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - uses: Mic92/hestia@69707ea4f233a235c599e3ffedd98955b9d1d6ff # v3.1.0
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: 'cache.nixos.org-1 cache.kachick.dev-1 kachick.cachix.org-1'
      - parallel:
          # BEGIN MANAGED PACKAGES
          - name: antigravity-cli
            run: go run ./cmd/ci-build package antigravity-cli

          - name: conoha-cli
            run: go run ./cmd/ci-build package conoha-cli

          - name: filen-cli-rs
            run: go run ./cmd/ci-build package filen-cli-rs

          - name: gh-actions-lock
            run: go run ./cmd/ci-build package gh-actions-lock

          - name: git-hooks-pre-push
            run: go run ./cmd/ci-build package git-hooks-pre-push

          - name: hcpu_shogi
            run: go run ./cmd/ci-build package hcpu_shogi

          - name: ibus-engine-selector
            run: go run ./cmd/ci-build package ibus-engine-selector

          - name: kanata-tray
            run: go run ./cmd/ci-build package kanata-tray

          - name: lima-full
            run: go run ./cmd/ci-build package lima-full

          - name: nix-update
            run: go run ./cmd/ci-build package nix-update

          - name: reponame
            run: go run ./cmd/ci-build package reponame

          - name: yaneuraou-avx2
            run: go run ./cmd/ci-build package yaneuraou-avx2

          - name: zed-editor
            run: go run ./cmd/ci-build package zed-editor --skip-tests
          # END MANAGED PACKAGES
      - name: Connect Tailscale
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
      - name: Push build closures to niks3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: go run ./cmd/ci-build push --from-dir "$CI_BUILD_OUT_PATHS_DIR"

  home-manager:
    name: 🏠 Home Manager
    needs: [packages]
    permissions:
      contents: read
      actions: read # Detect evicted cache entries upfront in hestia
      id-token: write # Required for Tailscale and niks3 OIDC authentication
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - uses: Mic92/hestia@69707ea4f233a235c599e3ffedd98955b9d1d6ff # v3.1.0
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: 'cache.nixos.org-1 cache.kachick.dev-1 kachick.cachix.org-1'
          read-only: 'false' # home-manager cache maybe reused in nixos step even if unristriced running order

      - name: Print some dotfiles overviews
        run: |
          </etc/nix/nix.conf
          ls -alh ~

      # https://www.reddit.com/r/Nix/comments/1443k3o/comment/jr9ht5g/?utm_source=reddit&utm_medium=web2x&context=3
      - run: mkdir -p ~/.local/state/nix/profiles
      - run: nix run .#home-manager -- switch -b backup --flake ".#github-actions@ubuntu-26.04"
      - run: zsh -c 'sudo --preserve-env=PATH env nix run ".#apply-system"'
      - name: Print some paths and versions
        run: |
          which zsh
          which bash
          which ruby
          which irb
          which ssh
      - name: Make sure the $PATH for bash is not overridden as like the `path_helper`. See https://github.com/kachick/dotfiles/issues/503
        run: |
          [[ "$(zsh -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
          [[ "$(bash -c 'which bash')" == "$HOME/.nix-profile/bin/bash" ]]
      # Do not use interactive mode here.
      # Solutions as https://github.com/actions/runner/issues/241#issuecomment-924327172 will not fit with several problems
      - name: Run customized dependencies
        run: |
          zsh -c zsh -c 'which la; which p'
          zsh -c 'starship --version'
          zsh -c 'ruby --version'
          zsh -c 'irb --version'
          zsh -c 'ssh -V'
          zsh -c 'hx --health'
      - name: Run homemade commands
        run: |
          zsh -c 'la ~; lat ~/.config'
          zsh -c "p neo-cowsay hello --command 'cowsay --rainbow \$(hello)'"
      - name: Connect Tailscale
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
      - name: Push home-manager generation to niks3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: go run ./cmd/ci-build push --pin dotfiles-main-home-manager ~/.local/state/nix/profiles/home-manager

  nixos:
    name: ❄️ NixOS
    needs: [packages]
    permissions:
      contents: read
      actions: read # Detect evicted cache entries upfront in hestia
      id-token: write # Required for Tailscale and niks3 OIDC authentication
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CI_BUILD_OUT_PATHS_DIR: /tmp/ci-build-out-paths
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - name: Logging disk space
        run: df -h
      # Prevent problems such as https://github.com/kachick/dotfiles/pull/1402#issuecomment-3736925185
      - uses: $/.github/actions/clean-disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - uses: Mic92/hestia@69707ea4f233a235c599e3ffedd98955b9d1d6ff # v3.1.0
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: 'cache.nixos.org-1 cache.kachick.dev-1 kachick.cachix.org-1'
          read-only: 'true' # nixos step is the last one, also the cache maybe too large
      - parallel:
          - name: Build NixOS - desktop-free
            run: go run ./cmd/ci-build nixos desktop-free

          - name: Build NixOS - wsl
            run: go run ./cmd/ci-build nixos wsl

          - name: Verify sample configuration template
            run: ./nixos/hosts/sample/verify.bash
      - name: Connect Tailscale
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
      - name: Push build closures to niks3
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: go run ./cmd/ci-build push --from-dir "$CI_BUILD_OUT_PATHS_DIR"
      - name: Pin NixOS desktop-free on main
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TAILSCALE_OAUTH_CLIENT_ID != '' }}
        env:
          NIKS3_SERVER_URL: ${{ secrets.NIKS3_SERVER_URL }}
        run: |
          TOPLEVEL=$(nix eval --raw .#nixosConfigurations.desktop-free.config.system.build.toplevel)
          go run ./cmd/ci-build pin dotfiles-main-nixos-desktop-free "$TOPLEVEL"
