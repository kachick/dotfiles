name: ❄️🐚 🐧
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/devshell-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'flake.*'
      - 'cmd/**'
      - 'internal/**'
      - '**.nix'
      - 'Taskfile.yml'
      - 'go.*'
  pull_request:
    paths:
      - '.github/workflows/devshell-linux.yml'
      - '.github/actions/setup-nix/**'
      - 'flake.*'
      - 'cmd/**'
      - 'internal/**'
      - '**.nix'
      - 'Taskfile.yml'
      - 'go.*'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  inspect:
    name: 🔍 Inspect
    # Only on Linux is enough to check the flake
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Print some dotfiles overviews
        shell: bash -eu -o pipefail {0}
        run: |
          </etc/nix/nix.conf
          ls -alh ~
      - name: Inspect flake outputs
        run: |
          nix flake show
          nix flake show . --json 2>/dev/null | jq '.packages | ."x86_64-linux" | to_entries | map("\(.key) # \(.value.description)")'
      - run: nix flake check --impure
        env:
          # Required to clarify allowing unfree even in check ... :<
          # This does not make problem only here, because this step does not upload any artifacts.
          NIXPKGS_ALLOW_UNFREE: '1'

  tasks:
    name: 🏃 Tasks
    strategy:
      matrix:
        runner: [ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          # Nix shell provides the Go binary. This step is only for enabling standard GitHub Actions caching
          # for Go modules and builds which are not covered by the Nix binary cache in the 'tasks' job.
          go-version-file: 'go.mod'
          cache: true
      - uses: $/.github/actions/setup-nix
      - name: Install direnv
        # Installing git via nix to make sure it supports config based hooks
        # Because of ubuntu-slim and ubuntu-26.04 remains on 2.53 or before at 2026-06-18
        run: |
          nix profile add --inputs-from . nixpkgs#direnv nixpkgs#git
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"
      - run: task ci-dev
