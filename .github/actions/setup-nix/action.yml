name: 'Setup Nix'
description: 'Installs Nix and configures evaluation cache'
runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      with:
        extra-conf: |
          sandbox = true
          accept-flake-config = true
    - name: Cache Nix Evaluation and Tarballs
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/nix
        key: nix-eval-and-tarball-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
        restore-keys: |
          nix-eval-and-tarball-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
          nix-eval-and-tarball-${{ runner.os }}-
