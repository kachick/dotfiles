# One CLI to format the code tree - https://github.com/numtide/treefmt

# https://github.com/numtide/treefmt/blob/36dd785a73f40215abdfb7b37ba1c59324d835e8/docs/content/guides/unmatched-formatters.md
# https://github.com/numtide/treefmt/issues/317
on-unmatched = "info"

[global]
# "/*" means recursive
excludes = [
  ".git/*",
  ".direnv/*",
  "dist/*",
  "result/*",
  "dependencies/*",
  "*.lock",
]

[formatter.dprint]
command = "dprint"
options = ["fmt"]
includes = [
  "*.json",
  "*.jsonc",
  "*.toml",
  "*.md",
  "*.yaml",
  "*.yml",
  "*.kdl",
  "*.nix",
]

[formatter.shfmt]
command = "shfmt"
options = [
  "--language-dialect",
  "auto",
  "--write",
]
includes = [
  "*.sh",
  "*.bash",
  "*.envrc",

  # shfmt supports zsh since 3.13.0. See GH-1482
  "*.zsh",
]
