# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

silent: false

# Don't use negated glob patterns. They often make hashing much slower.
tasks:
  default:
    deps:
      - help

  apply:
    desc: Shorthand to rebuild NixOS or home-manager
    deps:
      - build-cmd
    cmds:
      - ./dist/dot-task apply

  nixos:
    desc: Enable NixOS config for current device
    deps:
      - build-cmd
    cmds:
      - ./dist/dot-task nixos

  home-manager:
    aliases:
      - hm
    desc: Enable home-manager config for current user and device
    deps:
      - build-cmd
    cmds:
      - ./dist/dot-task home-manager

  test:
    desc: Make sure NixOS and/or home-manager will work for current user and device
    deps:
      - test-go
      - test-sample-nixos
      - check-nixos
      - test-home-session-vars
      - test-shell-delegation
    cmds:
      - ./scripts/dry.bash {{.CLI_ARGS}}

  test-home-session-vars:
    desc: Verify non-NixOS Home Manager session variables in sandbox
    cmds:
      - nix-build scripts/test-home-session-vars.nix --no-out-link

  test-shell-delegation:
    desc: Verify bash to zsh delegation in sandbox E2E tests
    cmds:
      - nix-build scripts/test-shell-delegation.nix --no-out-link

  check-nixos:
    desc: Dry-run all NixOS configurations in this repository
    cmds:
      - nix build .#nixosConfigurations.moss.config.system.build.toplevel --dry-run
      - nix build .#nixosConfigurations.algae.config.system.build.toplevel --dry-run
      - nix build .#nixosConfigurations.desktop-free.config.system.build.toplevel --dry-run
      - nix build .#nixosConfigurations.wsl.config.system.build.toplevel --dry-run
      - nix build .#nixosConfigurations.sandbox.config.system.build.toplevel --dry-run

  test-sample-nixos:
    desc: Verify the sample NixOS configuration template
    cmds:
      - ./nixos/hosts/sample/verify.bash

  test-go:
    sources:
      - '**/*.go'
      - 'config/**/*'
    cmds:
      - go test ./...

  mkdir:
    internal: true
    cmds:
      - mkdir -p dist/race

  setup:
    desc: You should run this task just after cloned
    deps:
      - help
      - build-cmd
    cmds:
      - git config --local include.path ../.gitconfig

      # Check commands
      - git config --list --local --includes --show-origin
      - git hook list pre-commit

  fmt:
    cmds:
      - dprint fmt

  build-cmd:
    deps:
      - mkdir
    sources:
      - '**/*.go'
      - 'go.mod'
    generates:
      - dist/**
    # Checking race condition requires CGO_ENABLED=1 and gcc. See https://github.com/golang/go/issues/9918
    cmds:
      - go build -v -o dist ./...

  lint:
    deps:
      - build-cmd
    cmds:
      - ./dist/lint

  lint-all:
    desc: Includes heavy linters
    deps:
      - build-cmd
    cmds:
      - ./dist/lint -all

  sync-workflows:
    aliases:
      - sync-packages
    desc: Synchronize workflow files with pkgs/list.toml
    cmds:
      - go run ./cmd/ci-build sync-workflows
      - dprint fmt .github/workflows/nix.yml .github/workflows/update-local-packages.yml

  check-sync-workflows:
    internal: true
    cmds:
      - go run ./cmd/ci-build sync-workflows --check

  check:
    deps:
      - 'build-cmd'
      - 'test'
      - 'lint-all'
      - 'check-sync-workflows'

  update:
    desc: Bump dependencies
    deps:
      - build-cmd
    cmds:
      - ./dist/dot-task update

  help:
    desc: If forgot anything
    cmds:
      - task --list-all

  workspace:
    desc: Open Terminal Multiplexer that configured to maintain this repository
    cmds:
      - zellij --layout ./config/zellij/layouts/dotfiles.kdl

  sandbox:
    desc: Run container
    cmds:
      - ./containers/sandbox.bash

  ghcr:
    # It looks like no paging and sorting API. So keep feawest than last 50 images
    # Now it is cared in deployment workflow (container.yml) via reusable cleanup-ghcr workflow
    desc: Run container with selecting the tag with fuzzy finder
    deps:
      - build-cmd
    cmds:
      - ./dist/dot-task ghcr

  ghcr-*:
    desc: Run container which is built and registered via GitHub Actions
    vars:
      TAG: '{{index .MATCH 0}}'
    cmds:
      - './containers/sandbox.bash --ghcr {{.TAG}}'

  build-container:
    aliases:
      - load-container-layered
    desc: Build and stream-load the layered container image into podman
    cmds:
      - './containers/build.bash'

  test-container:
    desc: Run container smoke tests against local or GHCR image
    vars:
      IMAGE: '{{.IMAGE | default "localhost/home:latest"}}'
    cmds:
      - './containers/test.bash {{.IMAGE}}'

  ci-dev:
    desc: Provided for CI
    deps:
      - 'default'
      - 'setup'
      # 'test-sample-nixos' # Run in nix workflow in GHA
      # 'test', # Needs home-manager, so needless in Nix-CI
      - 'test-go'
      - 'lint-all'
      - 'test-home-session-vars'
      - 'test-shell-delegation'
